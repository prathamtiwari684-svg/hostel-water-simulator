<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostel Water Tank Simulator</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--tx:#14232e;--mu:#5d7080;--bd:#d3dde4;--w:#3aa6d8;--ac:#0b6fa4;--ok:#188a55;--bad:#c8382f;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171d;--card:#16232c;--tx:#e6eef3;--mu:#8fa5b4;--bd:#2a3b46;--ac:#4cb4ea;--ok:#43c383;--bad:#ff7168;--warn:#f0b44c}}
:root[data-theme="dark"]{--bg:#0e171d;--card:#16232c;--tx:#e6eef3;--mu:#8fa5b4;--bd:#2a3b46;--ac:#4cb4ea;--ok:#43c383;--bad:#ff7168;--warn:#f0b44c}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 12px}
.row{display:grid;grid-template-columns:200px 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.tank{position:relative;height:240px;border:3px solid var(--ac);border-top:none;border-radius:0 0 16px 16px;overflow:hidden}
.water{position:absolute;left:0;right:0;bottom:0;background:var(--w);transition:height .5s,background .5s;height:0}
.water.low{background:var(--bad)}
.tank span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.35);color:#fff;mix-blend-mode:normal}
.badge{display:inline-block;font-size:.8rem;padding:1px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.bad{color:var(--bad);border-color:var(--bad)}.badge.warn{color:var(--warn);border-color:var(--warn)}
button{padding:7px 14px;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:6px;font-weight:600;cursor:pointer}
button.g{background:none;color:var(--ac)}button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--w);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
label{color:var(--mu);font-size:.85rem}
.stu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stu div{border:1px solid var(--bd);border-radius:8px;padding:8px;text-align:center}
.stu b{display:block;margin-bottom:4px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}.stats b{font-size:1.2rem;display:block}
#log{max-height:170px;overflow:auto;font:13px/1.6 Consolas,monospace}#log div{border-bottom:1px solid var(--bd);padding:2px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body>
<h1>Hostel water tank simulator</h1>
<div class="row">
 <div class="card"><div class="tank"><div class="water" id="water"></div><span id="lvl"></span></div>
  <div style="margin-top:10px">Pump: <span class="badge" id="pstat"></span></div>
  <div style="margin-top:6px">Waiting: <span id="wq">none</span></div></div>
 <div>
  <div class="card">
   <div class="ctl"><button id="pump">Pump: OFF</button><button id="auto" class="g">Auto: OFF</button><button id="step" class="g">Step 1 tick</button><button id="reset" class="g">Reset</button></div>
   <div class="ctl"><label>Capacity <input type="range" id="cap" min="3" max="15" value="8"> <b id="capv">8</b></label>
   <label>Speed <input type="range" id="spd" min="1" max="5" value="3"></label></div>
   <div class="stats"><div><b id="s1">0</b>pumped in</div><div><b id="s2">0</b>served</div><div><b id="s3">0</b>times a student had to wait</div></div>
  </div>
  <div class="card"><label>Students (click to ask for 1 unit of water)</label>
   <div class="stu" id="stu" style="margin-top:6px"></div></div>
 </div>
</div>
<div class="card"><label>Event log</label><div id="log"></div></div>
<script>
const $=id=>document.getElementById(id);
const names=['Asha','Ben','Chitra','Dev'];
let cap=8,level=0,pumpOn=false,autoOn=false,timer=null,pumped=0,served=0,waited=0,queue=[],got=[0,0,0,0],full=false;
function say(m,c){const d=document.createElement('div');if(c)d.className=c;d.textContent=m;$('log').prepend(d)}
function serve(i){level--;served++;got[i]++;say(names[i]+' got 1 unit','ok')}
function request(i){
 if(queue.includes(i))return;
 if(level>0){serve(i)}else{queue.push(i);waited++;say(names[i]+' found the tank empty and is WAITING','bad')}
 draw()}
function tick(){
 full=false;
 if(pumpOn){
  if(level<cap){level++;pumped++;say('Pump added 1 unit ('+level+'/'+cap+')')}
  else{full=true;say('Pump is blocked: tank full','bad')}}
 while(level>0&&queue.length)serve(queue.shift());
 if(autoOn&&Math.random()<0.6)request(Math.floor(Math.random()*names.length));
 draw()}
function draw(){
 const pct=level/cap*100;
 $('water').style.height=pct+'%';$('water').className='water'+(pct<=20?' low':'');
 $('lvl').textContent=level+' / '+cap;
 const p=$('pstat');
 if(!pumpOn){p.textContent='off';p.className='badge'}
 else if(full){p.textContent='blocked (full)';p.className='badge warn'}
 else{p.textContent='running';p.className='badge ok'}
 $('wq').textContent=queue.map(i=>names[i]).join(', ')||'none';
 $('s1').textContent=pumped;$('s2').textContent=served;$('s3').textContent=waited;
 $('stu').innerHTML=names.map((n,i)=>'<div><b>'+n+'</b><button data-i="'+i+'"'+(queue.includes(i)?' disabled':'')+'>'+(queue.includes(i)?'Waiting...':'Draw water')+'</button><div style="color:var(--mu);font-size:.8rem;margin-top:4px">Received: '+got[i]+'</div></div>').join('');
 $('pump').textContent='Pump: '+(pumpOn?'ON':'OFF');$('auto').textContent='Auto: '+(autoOn?'ON':'OFF')}
function restart(){clearInterval(timer);timer=null;if(pumpOn||autoOn)timer=setInterval(tick,1300-$('spd').value*220)}
$('stu').onclick=e=>{const b=e.target.closest('button[data-i]');if(b)request(+b.dataset.i)};
$('pump').onclick=()=>{pumpOn=!pumpOn;say('Pump turned '+(pumpOn?'ON':'OFF'));restart();draw()};
$('auto').onclick=()=>{autoOn=!autoOn;say('Auto student requests '+(autoOn?'ON':'OFF'));restart();draw()};
$('step').onclick=tick;
$('spd').oninput=restart;
$('cap').oninput=e=>{cap=+e.target.value;$('capv').textContent=cap;if(level>cap){level=cap;say('Tank resized, extra water overflowed','bad')}draw()};
$('reset').onclick=()=>{level=0;pumped=served=waited=0;queue=[];got=[0,0,0,0];pumpOn=autoOn=false;restart();$('log').innerHTML='';draw()};
draw();
</script></body></html>
